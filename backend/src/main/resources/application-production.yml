spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
